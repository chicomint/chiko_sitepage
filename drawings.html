<html lang="en">

<head>

    <link rel="shortcut icon" type="image/x-icon" href="/media/chiki.ico" />

    <meta charset="utf-8">
    <link rel="stylesheet" href="/style.css?v=1.8">
    <link rel="stylesheet" href="/sakura.css" media="screen" />
    <link rel="stylesheet" href="/sakura-dark.css" media="screen and (prefers-color-scheme: dark)" />
    <script src="/drawing-board.js?v=2" defer></script>
    <script src="/drawings.js?v=4" defer></script>
  <link rel="stylesheet" href="/cursor.css?v=4">
  <script src="cursor.js?v=3" defer></script>
  <script src="realtime.js?v=5" defer></script>
</head>

<body>

    <h1>chicomint</h1>
    <a href="/">| Homepage |</a>
    <a href="/blogs">blogs |</a>
    <a href="/project">project |</a>
    <a href="/credits">credits |</a>
    <a href="/drawings">drawings |</a>
        <a href="https://chicomint.atabook.org/">Guestbook |</a>
    <hr>

    <main>
        <p>Leave a little drawing here :3<br></p>
        <canvas id="drawing-canvas" class="drawing-canvas" width="640" height="480"
                aria-label="Drawing canvas. Draw with your mouse, pen, or touchscreen.">
            Your browser needs canvas support to draw here.
        </canvas>
<div class="drawing-tools" role="group" aria-label="Drawing tools">
<label for="drawing-color">Color</label><input id="drawing-color" type="color" value="#222222">
<label for="drawing-size">Size</label><input id="drawing-size" type="range" min="1" max="64" value="4"><output id="drawing-size-value" for="drawing-size">4</output>
<button id="drawing-draw" data-drawing-tool="draw" type="button" aria-pressed="true">Draw</button>
<button id="drawing-erase" data-drawing-tool="erase" type="button" aria-pressed="false">Eraser</button>
<button id="drawing-undo" type="button" disabled>Undo</button><button id="drawing-redo" type="button" disabled>Redo</button>
<button id="drawing-clear" type="button" title="Clear all drawings on every layer">Clear All</button><button id="drawing-download" type="button">Download</button>
<button id="drawing-send" type="button">Send drawing</button>
</div>
<details class="drawing-layer-panel" open><summary>Layers</summary><div id="drawing-layers" aria-label="Drawing layers"></div>
<div class="drawing-layer-actions"><button id="drawing-layer-add" type="button">Add</button><button id="drawing-layer-delete" type="button">Delete</button><button id="drawing-layer-up" type="button" title="Move layer toward the top">↑</button><button id="drawing-layer-down" type="button" title="Move layer toward the bottom">↓</button>
<label class="layer-rename">Name <input id="drawing-layer-name" maxlength="40" aria-label="Layer name"></label><button id="drawing-layer-rename" type="button">Rename</button></div></details>
        <p id="drawing-status" role="status" aria-live="polite"></p>
        <noscript>Enable JavaScript to draw. Visitor drawings are shown below.</noscript>
        <h2>Other people's drawings</h2>
        <p id="drawing-gallery-status" role="status">Loading drawings...</p>
        <div id="drawing-gallery" class="drawing-gallery"></div>
    </main>
<footer>
    <hr>
    <p style="animation: opacityPulse 2s ease-out;
    animation-iteration-count: infinite; 
    opacity: 1; color: rgb(81, 147, 31);">@Chicomint 2022-untill i die&lt;3 </p>
</footer>


</body>
</html>
