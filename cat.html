<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A little random cat break.">
  <meta name="color-scheme" content="light dark">
  <title>random cats · chicomint</title>
  <link rel="icon" href="media/chiki.ico">
  <link rel="stylesheet" href="style.css?v=3.2">
  <link rel="stylesheet" href="cursor.css?v=5">
  <script src="systems/cursor/client.js?v=5" defer></script>
  <script src="media/sidebar-image.js?v=2" defer></script>
  <script>
        window.onload = function () {
            let burger = document.getElementById("burger");
            burger?.addEventListener("keydown", (event) => {
                if (event.code == "Escape") burger.removeAttribute("open");
            });
            loadCats(4);
        };

        function loadCats(n) {
            const grid = document.getElementById("cat-grid");
            grid.innerHTML = "";
            const total = Math.min(Math.max(parseInt(n) || 1, 1), 12);
            for (let i = 0; i < total; i++) {
                const img = document.createElement("img");
                img.src = "https://cataas.com/cat?rand=" + Date.now() + i + Math.random();
                img.alt = "Random Cat #" + (i + 1);
                img.style.width = "200px";
                img.style.height = "200px";
                img.style.objectFit = "cover";

                grid.appendChild(img);
            }
        }

        function onRandomize() {
            loadCats(document.getElementById("cat-count").value);
        }
    </script>
</head>
<body class="chiko_site">

  <div class="chiko_box">
    <header class="snowy_banner" aria-label="Site header">
      <a class="chiko_title" href="index.html">Chicomint'site&lt;3</a>
      <span class="tiny_face">(๑・ω・๑)</span>
    </header>
    <aside class="left_side" aria-label="Site sidebar">
      <nav class="little_map side_box" aria-label="Main navigation">
        <h2>navigation</h2>
        <a href="index.html">home</a>
        <a href="blogs.html">blog</a>
        <a href="project.html">projects</a>
        <a href="drawings.html">drawings</a>
        <a href="credits.html">credits</a>
        <a href="https://chicomint.atabook.org/">guestbook</a>
      </nav>
      <section class="side_box visitor_box" aria-labelledby="stats-title">
        <h2 id="stats-title">site stats</h2>

        <dl class="visitor_count" aria-label="Visitor statistics">
          <dt>total visits</dt><dd data-presence-stat="visits" title="Includes historical visits">15,423</dd>
          <dt>On-site:</dt><dd data-presence-stat="online" aria-live="polite">offline</dd>
        </dl>

      </section>

      <div class="miku_kitty">
        <img class="random_pic" data-random-sidebar-image src="media/image/027f2e9193b1421b57f8c346864b5e76a4dcf06e.png" alt="" width="250" height="229" loading="lazy">

        <img class="blinkie" src="media/e50.gif" alt="A little blinkie from my collection" width="150" height="20" loading="lazy">
        <img class="blinkie" src="media/e116.gif" alt="Another favorite blinkie" width="150" height="20" loading="lazy">
      </div>
    </aside>
    <main id="main-content" class="my_stuff random-cats-page">
      <h1>random cats</h1>
      <p>
        How many pic do u want(1-12):
        <input type="number" id="cat-count" value="4" min="1" max="12" style="width:50px;">
        <button onclick="onRandomize()">Random it!</button>
    </p>

    <div id="cat-grid" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>
    </main>
