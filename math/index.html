<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Math Larp :3</title>
  <style>
    :root {
      --bg-body: #fff;
      --bg-topbar: #f0f0f0;
      --bg-modebar: #fafafa;
      --bg-game-area: #f5f5f5;
      --bg-question: #f0f0f0;
      --bg-input: #fff;
      --text-main: #222;
      --text-secondary: #555;
      --border-color: #ddd;
      --btn-bg: #fff;
      --btn-hover: #e8e8e8;
      --accent-color: #4a90d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #121212;
        --bg-topbar: #1e1e1e;
        --bg-modebar: #181818;
        --bg-game-area: #121212;
        --bg-question: #1e1e1e;
        --bg-input: #2a2a2a;
        --text-main: #e0e0e0;
        --text-secondary: #aaa;
        --border-color: #333;
        --btn-bg: #2a2a2a;
        --btn-hover: #3a3a3a;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      background: var(--bg-topbar);
      padding: 6px 12px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #topbar span { font-weight: bold; }

    #mode-bar {
      background: var(--bg-modebar);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    #mode-bar label { color: var(--text-secondary); margin-right: 4px; }

    .mode-btn, .toggle-btn {
      padding: 4px 14px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
    }

    .mode-btn.active, .toggle-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .mode-btn:hover:not(.active), .toggle-btn:hover:not(.active) {
      background: var(--btn-hover);
    }

    #image-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 300px;
      height: 300px;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    #bottom-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pop-animation {
      animation: pop 0.4s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    #game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-game-area);
    }

    #question-box {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      color: var(--text-main);
      background: var(--bg-question);
      padding: 20px 40px;
      border-radius: 4px;
    }

    #answer-input {
      width: 120px;
      height: 42px;
      font-size: 22px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      outline: none;
      background: var(--bg-input);
      color: var(--text-main);
      padding: 0 8px;
    }

    #answer-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(74,144,217,0.15);
    }

    #restart-btn {
      margin-left:auto;
      padding:3px 12px;
      font-size:12px;
      cursor:pointer;
      border:1px solid var(--border-color);
      border-radius:3px;
      background: var(--btn-bg);
      color: var(--text-main);
    }

    #feedback {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #feedback.show { opacity: 1; }
    #feedback.correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    #feedback.wrong   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    @media (prefers-color-scheme: dark) {
      #feedback.correct { background: #1b4332; color: #d4edda; border-color: #2d6a4f; }
      #feedback.wrong   { background: #4a1c1c; color: #f8d7da; border-color: #721c24; }
    }
  </style>
</head>
<body>

  <div id="topbar">
    <span>correct: <b id="correct-count">0</b></span>
    <span>wrong: <b id="wrong-count">0</b></span>
    <span>total: <b id="total-count">0</b></span>
    <span>streak: <span id="streak">0</span></span>
    <div style="margin-left:auto; display:flex; gap:8px;">
      <button id="hint-btn" class="toggle-btn">Hint</button>
      <button id="restart-btn" class="toggle-btn">Restart</button>
    </div>
  </div>

  <div id="mode-bar">
    <label>Mode:</label>
    <button class="mode-btn active" data-mode="×">× Multiply</button>
    <button class="mode-btn" data-mode="+">+ Add</button>
    <button class="mode-btn" data-mode="−">− Subtract</button>
    <button id="image-toggle" class="toggle-btn" style="margin-left: 20px;">open</button>
  </div>

  <div id="game-area">
    <div id="question-box">
      <span id="num1">7</span>
      <span id="operator">×</span>
      <span id="num2">8</span>
      <span>=</span>
      <input id="answer-input" type="number" autocomplete="off" placeholder="" />
    </div>
  </div>

  <div id="image-container">
    <img id="bottom-image" src="" alt="Random Image" />
  </div>

  <div id="feedback"></div>

    // Random image from imageList
    function setRandomImage() {
      const randImg = imageList[Math.floor(Math.random() * imageList.length)];
      bottomImage.src = `image/${randImg}`;
    }

    function updateImageToggleUI() {
      imageToggle.textContent = imagesEnabled ? 'Waifu: ON' : 'Waifu: OFF';
      imageToggle.classList.toggle('active', imagesEnabled);
      imageContainer.style.display = imagesEnabled ? 'flex' : 'none';
      if (imagesEnabled && (!bottomImage.src || bottomImage.src === window.location.href)) {
        setRandomImage();
      }
    }

    imageToggle.addEventListener('click', () => {
      imagesEnabled = !imagesEnabled;
      localStorage.setItem('math_images_enabled', imagesEnabled);
      updateImageToggleUI();
    });

    hintBtn.addEventListener('click', () => {
      inputEl.placeholder = correctAnswer;
      setTimeout(() => {
        inputEl.placeholder = "";
      }, 1000);
      inputEl.focus();
    });

    // Initial UI update
    updateImageToggleUI();

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        opEl.textContent = currentMode;
        nextQuestion();
      });
    });

    document.getElementById('restart-btn').addEventListener('click', startGame);

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nextQuestion() {
      inputEl.value = '';
      inputEl.focus();

      let a, b;

      if (currentMode === '×') {
        a = rand(1, 12);
        b = rand(1, 12);
        correctAnswer = a * b;
      } else if (currentMode === '+') {
        a = rand(1, 99);
        b = rand(1, 99);
        correctAnswer = a + b;
      } else { 
        a = rand(10, 99);
        b = rand(1, a); 
        correctAnswer = a - b;
      }

      num1El.textContent = a;
      num2El.textContent = b;
    }

    function showFeedback(msg, type) {
      feedbackEl.textContent = msg;
      feedbackEl.className = 'show ' + type;
      clearTimeout(feedbackTimeout);
      feedbackTimeout = setTimeout(() => {
        feedbackEl.className = '';
      }, 900);
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    inputEl.addEventListener('input', () => {
      const val = parseInt(inputEl.value);
      if (!isNaN(val) && inputEl.value.length >= correctAnswer.toString().length) {
        setTimeout(checkAnswer, 80);
      }
    });

    function triggerImagePop() {
      if (!imagesEnabled) return;
      bottomImage.classList.remove('pop-animation');
      void bottomImage.offsetWidth; // Trigger reflow
      bottomImage.classList.add('pop-animation');
    }

    function checkAnswer() {
      const val = parseInt(inputEl.value);
      if (isNaN(val)) return;
      totalCount++;
      totalEl.textContent = totalCount;

      if (val === correctAnswer) {
        streak++;
        score += 10 + (streak > 2 ? 5 : 0);
        correctCount++;
        streakEl.textContent = streak;
        correctEl.textContent = correctCount;
        showFeedback('✓ Correct!', 'correct');
        triggerImagePop();
        nextQuestion();
      } else {
        streak = 0;
        wrongCount++;
        streakEl.textContent = streak;
        wrongEl.textContent = wrongCount;
        showFeedback('✗ Try again!', 'wrong');
        inputEl.value = '';
      }
    }

    function startGame() {
      score = 0; streak = 0;
      correctCount = 0; wrongCount = 0; totalCount = 0;
      streakEl.textContent = 0;
      correctEl.textContent = 0;
      wrongEl.textContent = 0;
      totalEl.textContent = 0;
      inputEl.disabled = false;
      feedbackEl.className = '';
      nextQuestion();
    }

    setRandomImage();
    startGame();
  </script>
